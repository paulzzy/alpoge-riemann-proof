# Split build of the Lean archive published at https://alpo.ge/remark.pdf
#
# One run of this workflow builds one "round" of the archive on free runners:
#   plan     reads what earlier rounds built (from the `probe-results` branch)
#            and assigns files to jobs so that every file is compiled exactly
#            once: a job only builds a file if all of that file's unbuilt
#            imports are built by the same job.
#   build    one job per assignment: restores the compiled files of earlier
#            rounds, builds its files, and uploads the new compiled files.
#            One assignment is built twice ("twin") so the two results can be
#            compared byte for byte.
#   collect  never runs archive code. Merges the round's compiled files into
#            one artifact, records the round on the `probe-results` branch and
#            writes a report there.
#
# Compiling every file is necessary for the proof to hold but is not a
# verification of it. A kernel re-check of the finished build is a later step.
#
# Merging a change to this file starts a round. Further rounds can be started
# from the Actions tab, optionally several back to back.

name: build

on:
  push:
    branches: [main]
    paths: [".github/workflows/build.yml"]
  workflow_dispatch:
    inputs:
      jobs:
        description: "Parallel jobs in a round"
        default: "20"
      cap:
        description: "Most files one job may build"
        default: "7000"
      rounds:
        description: "How many rounds to run back to back"
        default: "1"

permissions: {}

concurrency:
  group: build-rounds
  cancel-in-progress: false

env:
  ARCHIVE_BASE: https://alpo.ge/lean.tar.gz.part
  ARCHIVE_PARTS: "14"
  ARCHIVE_SHA256: 9631b4f020199e580ba86178cb56c6e9b09f690c2369a80dc4334aa93f49c7fc
  MATHLIB_REV: 0df444a360eaa60ab8c11dca51a86af692955474
  JOBS: ${{ inputs.jobs || '20' }}
  CAP: ${{ inputs.cap || '7000' }}
  ROUNDS: ${{ inputs.rounds || '1' }}
  BUILD_MIN: "270"

jobs:
  plan:
    name: plan the round
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      round: ${{ steps.plan.outputs.round }}
      scheduled: ${{ steps.plan.outputs.scheduled }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check inputs
        run: |
          [[ "$JOBS" =~ ^[1-9][0-9]*$ ]] && [[ "$CAP" =~ ^[1-9][0-9]*$ ]] && [[ "$ROUNDS" =~ ^[1-9][0-9]*$ ]]

      - name: Fetch the archive
        run: bash tools/fetch.sh

      - name: Read the build state
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/state"
          git init -q "$RUNNER_TEMP/results"
          if git -C "$RUNNER_TEMP/results" fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" probe-results; then
            git -C "$RUNNER_TEMP/results" checkout -q FETCH_HEAD
            if [ -d "$RUNNER_TEMP/results/state" ]; then cp -r "$RUNNER_TEMP/results/state/." "$RUNNER_TEMP/state/"; fi
          fi
          ls "$RUNNER_TEMP/state" | head -20

      - name: Plan the round
        id: plan
        working-directory: x/lean
        run: |
          python3 -I "$GITHUB_WORKSPACE/tools/plan_round.py" --state "$RUNNER_TEMP/state" --jobs "$JOBS" --cap "$CAP" --out "$RUNNER_TEMP/plan" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-r${{ steps.plan.outputs.round }}
          path: ${{ runner.temp }}/plan/
          retention-days: 30
          if-no-files-found: error

  build:
    name: round ${{ needs.plan.outputs.round }}, job ${{ matrix.id }}${{ matrix.twin && ' (twin)' || '' }}
    needs: plan
    if: needs.plan.outputs.scheduled != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      ROUND: ${{ needs.plan.outputs.round }}
      JOB_ID: ${{ matrix.id }}
      TWIN: ${{ matrix.twin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up archive, Lean and Mathlib
        run: bash tools/setup.sh

      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan-r${{ needs.plan.outputs.round }}
          path: ${{ runner.temp }}/plan

      - name: Restore earlier rounds
        working-directory: x/lean
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/tools/restore.sh" "$RUNNER_TEMP/plan/plan.json"

      - name: Build
        working-directory: x/lean
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 -I "$GITHUB_WORKSPACE/tools/build_round.py" "$RUNNER_TEMP/plan/job-${JOB_ID}.txt" "$RUNNER_TEMP/out" "$((BUILD_MIN * 60))" || true

      - name: Record results and pack
        id: pack
        working-directory: x/lean
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/meta" "$RUNNER_TEMP/data"
          python3 -I "$GITHUB_WORKSPACE/tools/finish_round.py" "$RUNNER_TEMP/plan/job-${JOB_ID}.txt" "$RUNNER_TEMP/out" "$RUNNER_TEMP/meta" "$JOB_ID" "$TWIN"
          cat "$RUNNER_TEMP/meta/report.md" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TWIN" != "true" ] && [ -s "$RUNNER_TEMP/out/pack.txt" ]; then
            tar -C .lake -cf - -T "$RUNNER_TEMP/out/pack.txt" | zstd -q -T0 -10 --long=27 -o "$RUNNER_TEMP/data/built.tar.zst"
            ls -l "$RUNNER_TEMP/data"
            echo "packed=true" >> "$GITHUB_OUTPUT"
          fi
          df -h /

      - name: Upload compiled files
        if: steps.pack.outputs.packed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-r${{ needs.plan.outputs.round }}-j${{ matrix.id }}
          path: ${{ runner.temp }}/data/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

      - name: Mark the compiled files as stored
        if: steps.pack.outputs.packed == 'true'
        run: touch "$RUNNER_TEMP/meta/data_ok"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meta-r${{ needs.plan.outputs.round }}-j${{ matrix.id }}${{ matrix.twin && '-twin' || '' }}
          path: ${{ runner.temp }}/meta/
          retention-days: 30
          if-no-files-found: warn

      - name: Fail the job if any file is missing
        run: test -e "$RUNNER_TEMP/meta/complete"

  collect:
    name: record the round
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.scheduled != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write
    env:
      ROUND: ${{ needs.plan.outputs.round }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan-r${{ needs.plan.outputs.round }}
          path: ${{ runner.temp }}/plan

      - name: Download results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: meta-r${{ needs.plan.outputs.round }}-*
          path: ${{ runner.temp }}/metas

      - name: Record the round
        id: record
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/metas"
          git init -q "$RUNNER_TEMP/results"
          cd "$RUNNER_TEMP/results"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" probe-results 2>/dev/null; then
            git checkout -q -b probe-results FETCH_HEAD
          else
            git checkout -q --orphan probe-results
          fi
          mkdir -p state runs
          python3 -I "$GITHUB_WORKSPACE/tools/collect.py" "$RUNNER_TEMP/plan" "$RUNNER_TEMP/metas" state "$GITHUB_RUN_ID" "runs/build-round-${ROUND}.md"
          printf '\nRun: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "runs/build-round-${ROUND}.md"

      - name: Download compiled files
        if: steps.record.outputs.built != '0'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: data-r${{ needs.plan.outputs.round }}-*
          path: ${{ runner.temp }}/datas

      - name: Keep only recorded jobs
        if: steps.record.outputs.built != '0'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/datas"
          for d in data-r"${ROUND}"-j*; do
            j="${d##*-j}"
            grep -qx "$j" "$RUNNER_TEMP/results/state/data-jobs-r${ROUND}.txt" || rm -rf "$d"
          done
          ls
          du -sh .

      - name: Upload the round's compiled files as one artifact
        if: steps.record.outputs.built != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: state-r${{ needs.plan.outputs.round }}
          path: ${{ runner.temp }}/datas/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Publish state and report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/results"
          cat "runs/build-round-${ROUND}.md" >> "$GITHUB_STEP_SUMMARY"
          git add state runs
          git commit -q -m "Build round ${ROUND}"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:probe-results

      - name: Start the next round
        if: env.ROUNDS != '1' && steps.record.outputs.built != '0' && steps.record.outputs.left != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main -f rounds="$((ROUNDS - 1))" -f jobs="$JOBS" -f cap="$CAP"
